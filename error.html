<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>페이지를 찾을 수 없습니다 (404)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 24px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 8px;
        }
        p {
            margin: 4px 0;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .code {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>요청하신 페이지를 찾을 수 없습니다.</p>
        <p>주소(URL, Uniform Resource Locator)가 정확한지 다시 확인해 주세요.</p>
        <p>
            <a href="/">메인 페이지로 돌아가기</a>
        </p>
        <p class="code">
            S3 정적 웹사이트 커스텀 에러 페이지 예시
        </p>
    </div>
</body>
</html>
